events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    server {
        listen 80;

        # Serve frontend
        root /app/frontend;

        location / {
            try_files $uri /index.html;
        }

        # Proxy API requests to FastAPI backend
        location /api/ {
            proxy_pass http://127.0.0.1:4004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Legacy /echo route if still used by frontend
        location /echo {
            proxy_pass http://127.0.0.1:4004/echo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
